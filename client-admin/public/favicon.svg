<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#8c261e"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="20" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="10 6" />
  
  <!-- Central Gold Star -->
  <polygon points="256,70 295,180 410,180 318,248 354,360 256,290 158,360 194,248 102,180 217,180" fill="url(#goldGrad)" />
  
  <!-- Rice Ear / Laurel Wreath Left & Right -->
  <path d="M 120,380 Q 90,260 160,140" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 392,380 Q 422,260 352,140" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Ribbon / Banner Bottom -->
  <path d="M 100,380 L 412,380 L 390,440 L 122,440 Z" fill="#8c261e" stroke="url(#goldGrad)" stroke-width="8" />
  <text x="256" y="422" font-family="sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">ĐĂK PXI</text>
</svg>